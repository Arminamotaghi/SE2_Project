version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: ticketing-db
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: secretpassword
      POSTGRES_DB: ticketing_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database/init.sql:/docker-entrypoint-initdb.d/init.sql
    restart: unless-stopped

  
  redis:
    image: redis:7-alpine
    container_name: ticketing-redis
    ports:
      - "6379:6379"
    restart: unless-stopped

  rabbitmq:
    image: rabbitmq:3-management-alpine
    container_name: ticketing-broker
    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest
    ports:
      - "5672:5672"
      - "15672:15672"
    restart: unless-stopped

  backend:
    build: ./Backend
    container_name: ticketing-backend
    command: uvicorn main:app --host 0.0.0.0 --port 8000 --reload
    ports:
      - "8000:8000"
    volumes:
      - ./Backend:/app
    environment:
      POSTGRES_HOST: postgres
      REDIS_HOST: redis
      RABBITMQ_HOST: rabbitmq
    env_file:
      - ./Backend/.env
    depends_on:
      - postgres
      - redis
      - rabbitmq
    restart: unless-stopped

  worker:
    build: ./Backend
    container_name: ticketing-worker
    command: python worker.py
    volumes:
      - ./Backend:/app
    environment:
      POSTGRES_HOST: postgres
      REDIS_HOST: redis
      RABBITMQ_HOST: rabbitmq
    env_file:
      - ./Backend/.env
    depends_on:
      - postgres
      - redis
      - rabbitmq
    restart: unless-stopped

  frontend:
    build: ./frontend
    container_name: ticketing-frontend
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  postgres_data: